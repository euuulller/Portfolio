# ==========================================================================
# Deploy no GitHub Pages
# O site é 100% estático: não há instalação de dependências, nem etapa de
# build, nem geração de artefato intermediário — o conteúdo do repositório
# É o site. O workflow apenas empacota a raiz e publica.
#
# Antes do primeiro uso: Settings › Pages › Source = "GitHub Actions".
# ==========================================================================
name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões mínimas necessárias para publicar (nada de escrita no repo).
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; se dois pushes chegarem juntos, o mais recente vence.
# cancel-in-progress: false para não abortar uma publicação já em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # O upload-pages-artifact empacota a raiz e exclui APENAS .git e .github.
      # Tudo o mais vira URL pública — e o robots.txt do site é "Allow: /", ou
      # seja, também indexável. Sem este passo, as instruções internas de agente
      # (.claude/skills/) e a documentação de engenharia (documents/) ficariam
      # acessíveis em https://euuulller.github.io/Portfolio/documents/… .
      # Nada é apagado do repositório: os arquivos continuam versionados, só
      # não entram no artefato publicado.
      - name: Remover material interno do artefato
        run: |
          set -euo pipefail
          # 'documents/' (raiz, docs de engenharia) NÃO é 'assets/documents/',
          # que guarda o PDF do currículo linkado pela navbar. O caminho abaixo
          # é relativo à raiz, então atinge só o primeiro.
          rm -rf .claude documents
          # -delete em vez de um glob: assets/js/vendor/README.md está três
          # níveis abaixo e 'assets/*/README.md' não o alcançaria.
          find assets -name README.md -delete
          # Config de desenvolvimento — sem função nenhuma num servidor web.
          rm -f .editorconfig .gitattributes .gitignore
          # Salvaguarda: .nojekyll precisa sobreviver, senão o Pages roda Jekyll
          # e descarta arquivos/pastas iniciados por underscore.
          test -f .nojekyll

      - name: Empacotar a raiz do repositório
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
